name: Backfill changelog

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build changelog.json from past releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[]' > releases.jsonl

          python3 - <<'EOF'
          import json, os

          existing = []
          if os.path.exists("changelog.json"):
              with open("changelog.json", encoding="utf-8") as f:
                  existing = json.load(f)

          known = {str(e.get("version")) for e in existing}
          added = []

          with open("releases.jsonl", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  r = json.loads(line)
                  if r.get("draft"):
                      continue
                  version = r["tag_name"].lstrip("v")
                  if version in known:
                      continue
                  known.add(version)
                  added.append(
                      {
                          "version": version,
                          "date": (r.get("published_at") or r["created_at"])[:10],
                          "notes": r.get("body") or "",
                      }
                  )

          def version_key(entry):
              return tuple(
                  int("".join(c for c in part if c.isdigit()) or 0)
                  for part in str(entry["version"]).split(".")
              )

          entries = sorted(existing + added, key=version_key, reverse=True)

          with open("changelog.json", "w", encoding="utf-8") as f:
              json.dump(entries, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(f"Added {len(added)} past release(s); {len(entries)} total.")
          EOF

          rm releases.jsonl

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git diff --cached --quiet || git commit -m "Backfill changelog from past releases"
          git push