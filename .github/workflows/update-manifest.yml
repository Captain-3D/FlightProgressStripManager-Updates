name: Update version.json

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.event.release.tag_name }}" \
            --pattern "Captains_FlightProgressStripManager.exe" \
            --output asset.exe

      - name: Compute sha256
        id: hash
        run: |
          SHA=$(sha256sum asset.exe | cut -d ' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Write version.json
        env:
          VERSION: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Captains_FlightProgressStripManager.exe"
          SHA: ${{ steps.hash.outputs.sha256 }}
        run: |
          python3 - <<'EOF'
          import json, os

          manifest = {
              "version": os.environ["VERSION"].lstrip("v"),
              "notes": os.environ["NOTES"],
              "url": os.environ["URL"],
              "sha256": os.environ["SHA"],
          }

          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet || git commit -m "Update version.json for ${{ github.event.release.tag_name }}"
          git push
